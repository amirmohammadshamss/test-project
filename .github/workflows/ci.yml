name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: restaurantos
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: restaurantos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U restaurantos -d restaurantos_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://restaurantos:ci-password@localhost:5432/restaurantos_test
      TEST_DATABASE_URL: postgresql://restaurantos:ci-password@localhost:5432/restaurantos_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-for-production-32-characters
      SEED_DEMO_PASSWORD: RestaurantOS-Test-2026!
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Restore local Nx task cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
  compose:
    name: Docker Compose smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: ci-docker-password
      JWT_SECRET: ci-docker-only-secret-at-least-32-characters
      SEED_DEMO_PASSWORD: RestaurantOS-Docker-Test-2026!
      WEB_ORIGIN: http://localhost:3000
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prepare disposable demo environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start complete stack
        run: docker compose up --build -d
      - name: Wait for database-backed web readiness
        run: node scripts/wait-for-http.mjs http://localhost:3000/api/v1/health/ready
      - name: Complete waiter and kitchen flow through Docker stack
        run: node --env-file=.env scripts/smoke.mjs
      - name: Retry after committed-response loss and PostgreSQL restart
        run: FAULT_API_URL=http://localhost:3000 FAULT_RESTART_COMPOSE_POSTGRES=1 node --env-file=.env scripts/fault-smoke.mjs
      - name: Confirm ordering continues during Redis outage
        run: |
          docker compose stop redis
          node scripts/wait-for-http.mjs http://localhost:3000/api/v1/health/ready
          SMOKE_SKIP_AI=1 node --env-file=.env scripts/smoke.mjs
      - name: Validate production HTTPS configuration
        env:
          PUBLIC_HOSTNAME: restaurant.example.com
        run: |
          docker compose -f docker-compose.yml -f docker-compose.https.yml config --quiet
          docker run --rm -e PUBLIC_HOSTNAME=restaurant.example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Show startup evidence on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop disposable test stack
        if: always()
        run: docker compose down --volumes
