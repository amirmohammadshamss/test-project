name: restaurantos
x-app: &app
  build: .
  image: restaurantos-local
  environment: &environment
    NODE_ENV: production
  init: true
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: restaurantos
      POSTGRES_DB: restaurantos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U restaurantos -d restaurantos]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 15
  initialize:
    <<: *app
    environment:
      <<: *environment
      DATABASE_URL: postgresql://restaurantos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/restaurantos
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?Set SEED_DEMO_PASSWORD}
    command: [sh, -c, 'pnpm db:migrate && pnpm db:seed']
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *app
    environment:
      <<: *environment
      DATABASE_URL: postgresql://restaurantos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/restaurantos
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      PLATFORM_ORIGIN: ${PLATFORM_ORIGIN:-http://localhost:3001}
      PLATFORM_ADMIN_ENABLED: ${PLATFORM_ADMIN_ENABLED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    command: [node, dist/apps/api/src/main.js]
    depends_on:
      initialize: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:4000/api/v1/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    <<: *app
    environment:
      <<: *environment
      DATABASE_URL: postgresql://restaurantos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/restaurantos
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    command: [node, dist/apps/worker/src/main.js]
    depends_on:
      initialize: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
  web:
    <<: *app
    environment:
      <<: *environment
      API_INTERNAL_URL: http://api:4000
    command: [pnpm, --filter, web, start]
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
  super-admin:
    profiles: [platform]
    <<: *app
    environment:
      <<: *environment
      API_INTERNAL_URL: http://api:4000
    command: [pnpm, --filter, super-admin, start]
    ports: ['127.0.0.1:3001:3001']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
