name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: restaurantos
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: restaurantos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U restaurantos -d restaurantos_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://restaurantos:ci-password@localhost:5432/restaurantos_test
      TEST_DATABASE_URL: postgresql://restaurantos:ci-password@localhost:5432/restaurantos_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-for-production-32-characters
      SEED_DEMO_PASSWORD: RestaurantOS-Test-2026!
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
